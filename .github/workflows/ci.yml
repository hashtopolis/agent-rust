name: ci
on:
  push:

# A newer push to the same ref supersedes the running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  formatting:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@v1
  clippy:
    name: cargo clippy (${{ matrix.os }})
    # cfg(unix) and cfg(windows) code only gets linted on its own platform.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
      - name: Clippy Check
        run: cargo clippy --locked --all-targets
  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      # Windows runners ship no rsync, so only unix hosts opt into the rsync test.
      - name: Enable rsync test
        if: runner.os != 'Windows'
        run: |
          rsync --version
          echo "HTP_RSYNC_TEST=1" >> "$GITHUB_ENV"
      # tests/http talks to a local HTTPS server signed by tests/fixtures/test-ca.pem.
      # First prove SSL_CERT_FILE works on each OS, then install the CA into the
      # Linux and Windows trust stores so the main test run exercises the
      # platform store there. macOS is left out: headless runners refuse to
      # change admin trust settings, and agents are not deployed on macOS.
      # The install steps never undo themselves and the localhost key is in the
      # repo, so they run only on throwaway GitHub-hosted runners.
      - name: Test TLS trust via SSL_CERT_FILE
        shell: bash
        run: cargo test --locked --test http
        env:
          HTP_TRUST_STORE_TEST: "1"
          SSL_CERT_FILE: ${{ github.workspace }}/tests/fixtures/test-ca.pem
      - name: Trust the test CA (Linux)
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo cp tests/fixtures/test-ca.pem /usr/local/share/ca-certificates/htp-agent-test-ca.crt
          sudo update-ca-certificates
      - name: Trust the test CA (Windows)
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        run: certutil -addstore -f Root tests\fixtures\test-ca.pem
      - name: Enable trust store test
        if: runner.os != 'macOS' && runner.environment == 'github-hosted'
        shell: bash
        run: echo "HTP_TRUST_STORE_TEST=1" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --locked
