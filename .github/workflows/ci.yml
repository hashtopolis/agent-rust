name: ci
on:
  push:

# A newer push to the same ref supersedes the running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  formatting:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@v1
  clippy:
    name: cargo clippy (${{ matrix.os }})
    # cfg(unix) and cfg(windows) code only gets linted on its own platform.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
      - name: Clippy Check
        run: cargo clippy --locked --all-targets
  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      # Windows runners ship no rsync, so only unix hosts opt into the rsync test.
      - name: Enable rsync test
        if: runner.os != 'Windows'
        run: |
          rsync --version
          echo "HTP_RSYNC_TEST=1" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --locked
