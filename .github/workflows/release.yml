name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: build ${{ matrix.target }}
    # Every target builds natively on its own OS, so each one only needs the
    # runner's own C toolchain (ring compiles C) and no cross-linker.
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-gnu
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}

      # musl-gcc for ring's C sources.
      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: ./scripts/bundle.sh build ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: dist/rust-agent/
          if-no-files-found: error

  bundle:
    name: build rust-agent.zip
    needs: build
    permissions:
      # Required so action-gh-release can create/update the release.
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Each artifact holds its own <target>/ folder, so merging them rebuilds
      # the staging tree that `bundle.sh package` expects.
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: dist/rust-agent
          merge-multiple: true

      - name: Package
        run: ./scripts/bundle.sh package

      - uses: actions/upload-artifact@v7
        with:
          name: rust-agent
          path: dist/rust-agent.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/rust-agent.zip
