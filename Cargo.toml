[package]
name = "htp-agent-rust"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/hashtopolis/agent-rust"

[lib]
name = "htp_agent"
path = "src/lib.rs"

[[bin]]
name = "htp-agent"
path = "src/main.rs"

[lints.clippy]
# Collapsing a guard into a let-chain hurts readability; we prefer nested ifs.
collapsible_if = "allow"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "charset",
    "http2",
    "rustls-tls",
    "rustls-tls-native-roots",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["v4"] }
gethostname = "1.1.0"
enum_dispatch = "0.3.13"
anyhow = "1.0.104"
sysinfo = "0.39.6"
pci-info = "0.4.0"
pci-ids = "0.2.6"
sevenz-rust2 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
self-replace = "1"
tempfile = "3.27.0"

[profile.release]
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
