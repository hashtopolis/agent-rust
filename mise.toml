[tools]
# zig is used purely as the cross-linker for cargo-zigbuild; it lets a single
# host build the linux-musl, windows-gnu and macOS targets with no per-target
# C toolchain. Keep this pin in sync with what cargo-zigbuild supports.
zig = "0.16"
# cargo-zigbuild wraps `cargo build`, invoking zig as the linker.
"cargo:cargo-zigbuild" = "latest"

[tasks.bundle]
description = "Cross-compile all release targets and produce dist/rust-agent.zip"
run = "./scripts/bundle.sh"
